<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erolgo Navigasyon Sistemi</title>
    <style>
        /* Sayfadaki tüm kenarlık ve boşlukları sıfırlıyoruz */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Çift kaydırma çubuğu oluşmasını engeller */
            background-color: #ffffff;
        }
        /* Iframe'i ekranı tamamen kaplayacak şekilde ayarlıyoruz */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      sandbox parametreleri uygulamanın çalışmasını sağlarken 
      ana adres çubuğunu (top-navigation) değiştirmesini engeller.
    -->
    <iframe 
        src="https://run.app"
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-downloads">
        Tarayıcınız iframe elementini desteklemiyor.
    </iframe>

</body>
</html>
